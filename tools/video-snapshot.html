<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #111;
        overflow: hidden;
      }

      video {
        width: 100vw;
        height: 100vh;
        object-fit: contain;
        background: #111;
      }
    </style>
  </head>
  <body>
    <video id="video" muted playsinline preload="auto">
      <source src="file:///C:/Users/TRIPA/Downloads/Download%20(1).mp4" type="video/mp4" />
    </video>
    <script>
      const video = document.getElementById("video");
      const time = Number(new URLSearchParams(location.search).get("t") || 0);

      video.addEventListener("loadedmetadata", () => {
        video.currentTime = Math.min(time, Math.max(0, video.duration - 0.1));
      });

      video.addEventListener("seeked", () => {
        document.body.dataset.ready = "true";
      });
    </script>
  </body>
</html>
